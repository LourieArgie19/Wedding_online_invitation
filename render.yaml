services:
  - type: web
    name: dyann-and-dennis
    runtime: docker
    repo: https://github.com/LourieArgie19/Wedding_online_invitation
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Dennis & Dy Ann"
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: INVITATION_PUBLIC_ONLY
        value: "true"
